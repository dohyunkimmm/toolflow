name: Documentation sync

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-sync:
    name: Canonical release / representative docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify representative docs follow canonical release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./release.json').version")"
          TAG="v${VERSION}"
          STATUS="$(node -p "require('./release.json').releaseStatus || 'verified'")"

          # README is a product landing page; versioned release evidence lives in CHANGELOG.
          if [ "${STATUS}" = "verified" ]; then
            grep -Fq "releases/tag/${TAG}" CHANGELOG.md
          elif [ "${STATUS}" = "candidate" ]; then
            grep -Fq "${TAG}" CHANGELOG.md
          else
            echo "Unsupported releaseStatus: ${STATUS}" >&2
            exit 1
          fi
          grep -Fq "## ${TAG}" CHANGELOG.md
          grep -Fq "${TAG}" docs/DEMO_WALKTHROUGH.md

          # Public Demo, SEO and production verification sources should agree.
          SITE="https://toolflow-dohyunkimmm.vercel.app"
          grep -Fq "[Demo](${SITE}/)" README.md
          grep -Fq "<link href=\"${SITE}/\" rel=\"canonical\"/>" index.html
          grep -Fq "PRODUCTION_URL: ${SITE}" .github/workflows/e2e.yml
          grep -Fq "PRODUCTION_URL: ${SITE}" .github/workflows/production-verify.yml
          grep -Fq "productionUrl:'${SITE}/'" scripts/verification-summary.js
          if grep -Fq "onboardos-rho.vercel.app" README.md index.html docs/*.md .github/workflows/*.yml config/playwright.production.config.js scripts/verification-summary.js; then
            echo "Removed legacy domain still referenced in representative documents" >&2
            exit 1
          fi
          if grep -Eq '2[–-]3분|약 (30|40|60)초' docs/DEMO_WALKTHROUGH.md; then
            echo "Timed walkthrough has reappeared" >&2
            exit 1
          fi
          if grep -Eq '#verification-matrix|Lighthouse 13[.]4[.]1' scripts/verification-summary.js; then
            echo "Obsolete verification evidence metadata" >&2
            exit 1
          fi
          # Reject stale recording references in representative public documents.
          if grep -Eiq 'production-demo|\.mp4' README.md docs/DEMO_WALKTHROUGH.md release.json; then
            echo "Obsolete recording reference in public documents" >&2
            exit 1
          fi
          if grep -q '^releaseStatus=' version.txt; then
            grep -Fq "releaseStatus=${STATUS}" version.txt
          fi

          STANDALONE_RELEASE_NOTES="$(find . -maxdepth 1 -type f -name 'RELEASE-v*.md' -print)"
          if [ -n "${STANDALONE_RELEASE_NOTES}" ]; then
            echo "Standalone release notes must stay consolidated in CHANGELOG.md + immutable GitHub Releases:"
            echo "${STANDALONE_RELEASE_NOTES}"
            exit 1
          fi

          echo "Documentation sync PASS: ${TAG} · ${STATUS}"
