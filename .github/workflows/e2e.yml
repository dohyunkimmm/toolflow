name: E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  statuses: read

jobs:
  playwright:
    name: Chromium quality / functional / a11y / visual / domain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-dependencies
      - name: Fast quality gate
        run: |
          npm run quality
          node --check js/app.js
          node --check js/a11y.js
          node --check js/analytics.js
          node --check js/events.js
          node --check js/state.js
          node --check scripts/quality-check.js
          node --check scripts/product-review-check.js
          node --check scripts/serve.js
          node --check scripts/asset-integrity.js
          node --check scripts/release-contract.js
          node --check scripts/release-evidence.js
          node --check scripts/resilience-summary.js
          node --check scripts/security-summary.js
          node --check scripts/ux-summary.js
          node --check scripts/visual-system-summary.js
          node --check scripts/public-assets.js
          node --check scripts/dependency-review.js
          node --check scripts/verification-summary.js
          node --check scripts/lighthouse-run.js
          node --check playwright.config.js
          node --check config/playwright.resilience.config.js
          node --check config/playwright.security.config.js
          node --check config/playwright.ux.config.js
          node --check config/playwright.visual-system.config.js
          node --check config/playwright.design-polish.config.js
          node --check config/playwright.cross-browser.config.js
          node --check config/playwright.production.config.js
          node --check config/lighthouserc.cjs
          node --check config/lighthouserc.mobile.cjs
          node --check tests/role-isolation.spec.js
          node --check tests/recovery.spec.js
          node --check tests/security.spec.js
          node --check tests/ux-interaction.spec.js
          node --check tests/visual-system.spec.js
          node --check tests/design-polish.spec.js
          node --check tests/experience-refinement.spec.js
          node --check tests/production.spec.js
          python3 -m json.tool vercel.json >/dev/null
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Functional, WCAG/keyboard/ARIA, domain, role isolation and visual regression tests
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-chromium
          path: playwright-report/
          retention-days: 7

  resilience:
    name: Resilience / recovery fault-injection gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-dependencies
      - run: npx playwright install --with-deps chromium
      - name: Run required resilience scenarios R1-R8
        run: |
          mkdir -p verification
          npm run test:resilience
      - name: Build machine-readable resilience evidence
        run: node scripts/resilience-summary.js verification/resilience-playwright.json
      - name: Upload resilience evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resilience-evidence-${{ github.sha }}
          path: |
            verification/resilience-summary.json
            verification/resilience-playwright.json
          if-no-files-found: error
          retention-days: 30

  security:
    name: Security / failure-containment gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-dependencies
      - run: npx playwright install --with-deps chromium
      - name: Run required security scenarios S1-S8
        run: |
          mkdir -p verification
          npm run test:security
      - name: Build machine-readable security evidence
        run: node scripts/security-summary.js verification/security-playwright.json
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-evidence-${{ github.sha }}
          path: |
            verification/security-summary.json
            verification/security-playwright.json
          if-no-files-found: error
          retention-days: 30

  ux:
    name: Interaction UX / accessibility state gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-dependencies
      - run: npx playwright install --with-deps chromium
      - name: Run required interaction UX scenarios U1-U8
        run: |
          mkdir -p verification/ux-screenshots
          npm run test:ux
      - name: Build machine-readable interaction UX evidence
        run: node scripts/ux-summary.js verification/ux-playwright.json
      - name: Upload interaction UX evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ux-evidence-${{ github.sha }}
          path: |
            verification/ux-summary.json
            verification/ux-playwright.json
            verification/ux-screenshots/
          if-no-files-found: error
          retention-days: 30

  visual-system:
    name: Visual system / usability state gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-dependencies
      - run: npx playwright install --with-deps chromium
      - name: Run required visual system scenarios V1-V8
        run: |
          mkdir -p verification/visual-system-screenshots
          npm run test:visual-system
      - name: Build machine-readable visual system evidence
        run: node scripts/visual-system-summary.js verification/visual-system-playwright.json
      - name: Upload visual system evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-system-evidence-${{ github.sha }}
          path: |
            verification/visual-system-summary.json
            verification/visual-system-playwright.json
            verification/visual-system-screenshots/
          if-no-files-found: error
          retention-days: 30

  design-polish:
    name: Design polish / responsive hierarchy gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-dependencies
      - run: npx playwright install --with-deps chromium
      - name: Run required design polish scenarios D1-D8
        run: |
          mkdir -p verification/design-polish-screenshots
          npm run test:design-polish
      - name: Upload design polish evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: design-polish-evidence-${{ github.sha }}
          path: |
            verification/design-polish-playwright.json
            verification/design-polish-screenshots/
          if-no-files-found: error
          retention-days: 30

  experience-refinement:
    name: Experience refinement / interaction clarity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-dependencies
      - run: npx playwright install --with-deps chromium
      - name: Run required experience refinement scenarios E1-E8
        run: |
          mkdir -p verification/experience-refinement-screenshots
          npm run test:experience
      - name: Upload experience refinement evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: experience-refinement-evidence-${{ github.sha }}
          path: |
            verification/experience-refinement-playwright.json
            verification/experience-refinement-screenshots/
          if-no-files-found: error
          retention-days: 30

  cross-browser:
    name: Firefox / WebKit functional smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-dependencies
      - run: npx playwright install --with-deps firefox webkit
      - run: npm run test:cross-browser
      - name: Upload cross-browser report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-cross-browser
          path: playwright-report-cross-browser/
          retention-days: 7

  lighthouse:
    name: Lighthouse desktop performance budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-dependencies
      - name: Lighthouse 13.4.1 desktop · 3 runs + budgets
        run: npm run test:lighthouse
      - name: Upload desktop Lighthouse reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports-desktop
          path: .lighthouseci/
          retention-days: 7

  lighthouse-mobile:
    name: Lighthouse mobile performance budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-dependencies
      - name: Lighthouse 13.4.1 mobile · 3 runs + budgets
        run: npm run test:lighthouse:mobile
      - name: Upload mobile Lighthouse reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports-mobile
          path: .lighthouseci-mobile/
          retention-days: 7

  supply-chain:
    name: Supply-chain security gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-dependencies
      - name: npm audit · high+
        run: npm audit --audit-level=high
      - name: Fetch PR base for dependency delta
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
      - name: PR dependency delta + source integrity
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/dependency-review.js "$BASE_SHA"

  production-smoke:
    name: Production desktop/mobile smoke + deployment integrity
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [playwright, resilience, security, ux, visual-system, design-polish, experience-refinement, cross-browser, lighthouse, lighthouse-mobile, supply-chain]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup-node-dependencies
      - name: Classify deployable runtime changes
        run: |
          runtime_changed=false
          echo 'Changed paths:'
          while IFS= read -r file; do
            echo "- ${file}"
            case "$file" in
              .github/*|*.md|docs/*|tests/*|scripts/*|config/*|playwright*.js|lighthouserc*.cjs|package*.json)
                ;;
              *)
                runtime_changed=true
                ;;
            esac
          done < <(git diff --name-only HEAD^ HEAD)
          echo "RUNTIME_CHANGED=${runtime_changed}" >> "$GITHUB_ENV"
          echo "Deployable runtime changed: ${runtime_changed}"
      - name: Wait for this commit's Vercel status
        if: env.RUNTIME_CHANGED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..36}; do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status" --jq '[.statuses[] | select(.context == "Vercel")][0].state // ""')"
            echo "Vercel status: ${state:-pending}"
            if [ "$state" = "success" ]; then exit 0; fi
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then exit 1; fi
            sleep 5
          done
          echo 'Timed out waiting for Vercel deployment status' >&2
          exit 1
      - name: Record non-runtime deployment decision
        if: env.RUNTIME_CHANGED != 'true'
        run: echo 'No deployable runtime files changed; verify existing Production by source integrity and browser smoke instead of requiring a new Vercel build.'
      - name: Production source integrity
        env:
          PRODUCTION_URL: https://toolflow-dohyunkimmm.vercel.app
        run: node scripts/asset-integrity.js "$PRODUCTION_URL"
      - name: Install Chromium + WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Production Desktop Chromium + iPhone WebKit browser smoke
        env:
          PRODUCTION_URL: https://toolflow-dohyunkimmm.vercel.app
        run: npm run test:production
      - name: Upload Production integrity evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-integrity-${{ github.sha }}
          path: verification/asset-integrity.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload Production smoke report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-production
          path: playwright-report-production/
          retention-days: 7

  evidence:
    name: Verification evidence
    needs: [playwright, resilience, security, ux, visual-system, design-polish, experience-refinement, cross-browser, lighthouse, lighthouse-mobile, supply-chain, production-smoke]
    if: >-
      always() &&
      needs.playwright.result == 'success' &&
      needs.resilience.result == 'success' &&
      needs.security.result == 'success' &&
      needs.ux.result == 'success' &&
      needs.visual-system.result == 'success' &&
      needs.design-polish.result == 'success' &&
      needs.experience-refinement.result == 'success' &&
      needs.cross-browser.result == 'success' &&
      needs.lighthouse.result == 'success' &&
      needs.lighthouse-mobile.result == 'success' &&
      needs.supply-chain.result == 'success' &&
      (github.event_name != 'push' || needs.production-smoke.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build verification summary
        env:
          CHROMIUM_RESULT: ${{ needs.playwright.result }}
          RESILIENCE_RESULT: ${{ needs.resilience.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          UX_RESULT: ${{ needs.ux.result }}
          VISUAL_SYSTEM_RESULT: ${{ needs.visual-system.result }}
          DESIGN_POLISH_RESULT: ${{ needs.design-polish.result }}
          EXPERIENCE_REFINEMENT_RESULT: ${{ needs.experience-refinement.result }}
          CROSS_BROWSER_RESULT: ${{ needs.cross-browser.result }}
          LIGHTHOUSE_RESULT: ${{ needs.lighthouse.result }}
          MOBILE_LIGHTHOUSE_RESULT: ${{ needs.lighthouse-mobile.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
          PRODUCTION_RESULT: ${{ needs.production-smoke.result }}
        run: node scripts/verification-summary.js
      - name: Upload verification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-evidence-${{ github.sha }}
          path: |
            verification/verification-summary.json
            verification/verification-summary.md
          retention-days: 30
