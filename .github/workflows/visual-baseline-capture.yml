name: Visual baseline capture (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/visual-baseline.spec.js'
      - 'config/playwright.visual-baseline.config.js'
      - '.github/workflows/visual-baseline-capture.yml'

permissions:
  contents: write

jobs:
  baseline-capture:
    name: Capture proposed pixel baselines for review
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: ./.github/actions/setup-node-dependencies
      - run: npx playwright install --with-deps chromium
      - name: Render stable login, catalog, modal and reviewer screenshots
        run: npx playwright test -c config/playwright.visual-baseline.config.js --update-snapshots
      - name: Upload proposed PNG baselines for visual review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proposed-toolflow-pixel-baselines
          path: tests/visual-baseline.spec.js-snapshots/
          if-no-files-found: error
          retention-days: 7
      - name: Commit reviewed PNG baselines to PR branch
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/visual-baseline.spec.js-snapshots/*.png
          if git diff --cached --quiet; then
            echo 'Pixel baselines unchanged'
          else
            git commit -m 'test: freeze reviewed ToolFlow pixel baseline PNGs'
            git push origin "HEAD:refs/heads/$PR_BRANCH"
          fi
