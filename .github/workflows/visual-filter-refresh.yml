name: Temporary visual baseline refresh - status filter clipping

on:
  pull_request:
    branches: [main]
    paths:
      - 'css/design-elevation.css'
      - 'tests/catalog-simplified.spec.js'
      - '.github/workflows/visual-filter-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh only changed pixel goldens on reviewed PR branch
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: ./.github/actions/setup-node-dependencies
      - run: npx playwright install --with-deps chromium
      - name: Re-render fixed-status-chip visual baselines
        run: npx playwright test -c config/playwright.visual-baseline.config.js --update-snapshots
      - name: Commit baseline updates
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/visual-baseline.spec.js-snapshots/*.png
          if git diff --cached --quiet; then
            echo 'No snapshot changes'
          else
            git commit -m 'test: update catalog border pixel baselines'
            git push origin "HEAD:refs/heads/$PR_BRANCH"
          fi
